name: Deploy Swiggy Analytics Dashboard

on:
  push:
    branches: [main]
    paths:
      - "projects/swiggy-funnel-retention/dashboard/Swiggy_Funnel_Retention_Dashboard.html"
      - ".github/workflows/deploy-swiggy-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "swiggy-dashboard-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare dashboard site
        run: |
          mkdir -p _site
          cp projects/swiggy-funnel-retention/dashboard/Swiggy_Funnel_Retention_Dashboard.html _site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
