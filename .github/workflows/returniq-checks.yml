name: ReturnIQ Quality Gates & Conditional Frontend Build

on:
  push:
    branches: [main]
    paths:
      - "projects/returniq/**"
      - ".github/workflows/returniq-checks.yml"
      - "README.md"
  pull_request:
    branches: [main]
    paths:
      - "projects/returniq/**"
      - ".github/workflows/returniq-checks.yml"
      - "README.md"
  workflow_dispatch:

jobs:
  python-benchmarks:
    name: Deterministic Artifact Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/returniq
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run 35 artifact regression checks
        run: python scripts/run_regression_tests.py

      - name: Evaluate saved golden-set predictions (N=100)
        run: python scripts/evaluate_golden_set.py

      - name: Verify EXP-1041 arithmetic
        run: python scripts/verify_experiment_calc.py

  frontend-build:
    name: Conditional Frontend Build
    runs-on: ubuntu-latest
    needs: python-benchmarks
    defaults:
      run:
        working-directory: projects/returniq
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect complete frontend build inputs
        id: frontend
        shell: bash
        run: |
          if [ -d "src" ] && [ -f "package.json" ] && [ -f "package-lock.json" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Frontend source and npm lockfile are present."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Skipping frontend compile: this repository currently lacks one or more required inputs (src/, package.json, package-lock.json)."
          fi

      - name: Set up Node.js
        if: steps.frontend.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: projects/returniq/package-lock.json

      - name: Install locked dependencies
        if: steps.frontend.outputs.ready == 'true'
        run: npm ci

      - name: Build and type-check frontend
        if: steps.frontend.outputs.ready == 'true'
        run: npm run build
