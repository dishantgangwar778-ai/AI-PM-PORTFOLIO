name: ReturnIQ Quality Gates & Frontend Build

on:
  push:
    branches: [main]
    paths:
      - "projects/returniq/**"
      - ".github/workflows/returniq-checks.yml"
      - "README.md"
  pull_request:
    branches: [main]
    paths:
      - "projects/returniq/**"
      - ".github/workflows/returniq-checks.yml"
      - "README.md"
  workflow_dispatch:

jobs:
  python-benchmarks:
    name: Deterministic Artifact Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/returniq
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run 35 artifact regression checks
        run: python scripts/run_regression_tests.py
      - name: Evaluate saved golden-set predictions (N=100)
        run: python scripts/evaluate_golden_set.py
      - name: Verify EXP-1041 arithmetic
        run: python scripts/verify_experiment_calc.py

  frontend-build:
    name: Frontend Build & TypeScript Check
    runs-on: ubuntu-latest
    needs: python-benchmarks
    defaults:
      run:
        working-directory: projects/returniq
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check frontend source and package manifest
        id: frontend
        shell: bash
        run: |
          if [ -d "src" ] && [ -f "package.json" ] && [ -f "index.html" ] && [ -f "vite.config.ts" ] && [ -f "tsconfig.json" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Frontend source and build configuration found."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Frontend build cannot run because required source/configuration files are missing."
          fi
      - name: Set up Node.js
        if: steps.frontend.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies
        if: steps.frontend.outputs.ready == 'true'
        run: npm install
      - name: Build and type-check frontend
        if: steps.frontend.outputs.ready == 'true'
        run: npm run build
