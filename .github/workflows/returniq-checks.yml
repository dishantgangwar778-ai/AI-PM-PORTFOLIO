name: ReturnIQ Quality Gates & Frontend Build

on:
  push:
    branches: [main]
    paths:
      - "projects/returniq/**"
      - ".github/workflows/returniq-checks.yml"
      - "README.md"
  pull_request:
    branches: [main]
    paths:
      - "projects/returniq/**"
      - ".github/workflows/returniq-checks.yml"
      - "README.md"
  workflow_dispatch:

jobs:
  python-benchmarks:
    name: Deterministic Artifact Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/returniq
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run 35 artifact regression checks
        run: python scripts/run_regression_tests.py
      - name: Evaluate saved golden-set predictions (N=100)
        run: python scripts/evaluate_golden_set.py
      - name: Verify EXP-1041 arithmetic
        run: python scripts/verify_experiment_calc.py

  frontend-build:
    name: Frontend Build & TypeScript Check
    runs-on: ubuntu-latest
    needs: python-benchmarks
    permissions:
      contents: write
    defaults:
      run:
        working-directory: projects/returniq
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate and commit package-lock.json if missing
        shell: bash
        run: |
          if [ ! -f package-lock.json ]; then
            echo "package-lock.json is missing; generating it from package.json."
            npm install --package-lock-only --legacy-peer-deps
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            if git diff --cached --quiet; then
              echo "No lockfile changes to commit."
            else
              git commit -m "chore(deps): auto-generate ReturnIQ package lockfile"
              git push origin HEAD:main
            fi
          else
            echo "package-lock.json already exists; no auto-commit needed."
          fi
      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps
      - name: Build and type-check frontend
        run: npm run build
